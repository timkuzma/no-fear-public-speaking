# Variant for an existing HAProxy TLS terminator on the same host.
# Replace pilot.example.org and add an exact HAProxy host ACL/backend on port 9081.
server {
    listen 80;
    listen [::]:80;
    server_name pilot.example.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/no-fear-stage-acme;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:9081;
    server_name pilot.example.org;
    client_max_body_size 33m;
    client_body_timeout 120s;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location /api/operator/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }
}
