# Append to the existing shared HAProxy configuration; retain its port-443 frontend.
# Replace pilot.example.org with the exact application hostname. The existing
# no_fear_stage backend must point to the protected loopback Nginx virtual host.
frontend no_fear_stage_fallback_https
    bind *:10443 ssl crt /etc/haproxy/certs/no-fear-stage.pem alpn http/1.1
    http-request set-log-level silent
    acl application_host hdr(host) -i pilot.example.org pilot.example.org:10443
    http-request deny deny_status 421 unless application_host
    # Admit only this exact additional origin. Leave every other Origin and
    # Sec-Fetch-Site untouched so application origin/CSRF checks still reject it.
    acl fallback_origin req.hdr(origin) -m str https://pilot.example.org:10443
    http-request set-header Origin https://pilot.example.org if fallback_origin
    http-request set-header Host pilot.example.org
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 10443
    default_backend no_fear_stage
