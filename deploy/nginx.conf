# Install on the same host after supplying the real hostname and TLS certificate.
server {
    listen 80;
    server_name pilot.example.org;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pilot.example.org;
    ssl_certificate /etc/letsencrypt/live/pilot.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilot.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 33m;
    client_body_timeout 120s;
    location /api/operator/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }
}
